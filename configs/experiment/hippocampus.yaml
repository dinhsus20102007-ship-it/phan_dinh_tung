# @package _global_

defaults:
  - override /data: test/hippocampus
  - override /model: nnunet
  - override /callbacks: default
  - override /trainer: default

tags: ["test", "hippocampus"]
seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 20
  gradient_clip_val: 12

model:
  num_classes: 3          # nền + 2 vùng hippocampus
  net:
    in_channels: 1
    dim: 3

data:
  batch_size: 2

logger:
  wandb:
    tags: ${tags}
    group: "test"
  aim:
    experiment: "test"