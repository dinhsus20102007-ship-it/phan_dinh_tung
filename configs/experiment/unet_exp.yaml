# @package _global_

# to execute this experiment run:
# python src/train.py experiment=nnunet

defaults:
  - override /data: mnist          # đổi thành tên file data mới khi có
  - override /model: nnuet         # hoặc nnunet nếu bạn đổi tên file model
  - override /callbacks: default
  - override /trainer: default

tags: ["segmentation", "nnunet_arch"]

seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 100
  gradient_clip_val: 12

model:
  optimizer:
    lr: 0.001
  net:
    in_channels: 1
    dim: 2
  compile: false

data:
  batch_size: 2

logger:
  wandb:
    tags: ${tags}
    group: "segmentation"
  aim:
    experiment: "segmentation"
